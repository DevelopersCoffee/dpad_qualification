name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9].*'

jobs:
  publish:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
      - name: Publish package
        run: dart pub publish --force
